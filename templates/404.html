<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not found</title>
<style>
  :root{
    --bg:#f4f5f7; --text:#1f2328; --muted:#6b7280;
    --accent:#2563eb; --accent-hover:#1d4ed8; --border:#d7dbe0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --text:#e6e8eb; --muted:#9aa1ab;
      --accent:#3b82f6; --accent-hover:#60a5fa; --border:#33383f;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px 16px; gap:16px;
  }
  .code{ font-size:64px; font-weight:700; color:var(--accent); line-height:1; }
  .msg{ color:var(--muted); font-size:15px; max-width:360px; }
  a{ text-decoration:none; }
  button{
    font:inherit; font-weight:600; cursor:pointer;
    padding:12px 18px; color:#fff; background:var(--accent);
    border:none; border-radius:8px; margin-top:6px;
  }
  button:hover{ background:var(--accent-hover); }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <div class="msg">This page doesn't exist.</div>
  <a href="/"><button>Back to home</button></a>
</div>
</body>
</html>
