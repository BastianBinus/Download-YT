<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<style>
  :root{
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --border: #d7dbe0;
    --danger: #dc2626;
    --track: #e5e7eb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #16181c;
      --card: #1f2227;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --border: #33383f;
      --danger: #ef4444;
      --track: #33383f;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5;
  }
  .wrap{
    max-width:640px; margin:0 auto;
    padding:32px 16px 60px;
  }
  h1{
    font-size:22px; font-weight:650; margin:0 0 4px;
  }
  .subtitle{ color:var(--muted); font-size:14px; margin-bottom:24px; }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:20px;
  }

  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text]{
    flex:1 1 200px;
    font:inherit;
    padding:12px 12px;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
  }
  input[type=text]:focus{ border-color:var(--accent); }

  button{
    font:inherit; font-weight:600; cursor:pointer;
    padding:12px 18px;
    color:#fff; background:var(--accent);
    border:none; border-radius:8px;
    white-space:nowrap; touch-action:manipulation;
  }
  button:hover{ background:var(--accent-hover); }
  button:disabled{ opacity:.55; cursor:default; }
  button.small{ padding:8px 12px; font-size:13px; }
  button.ghost{ background:transparent; color:var(--accent); border:1px solid var(--border); }
  button.ghost:hover{ background:var(--track); }
  button.danger{ background:transparent; color:var(--danger); border:1px solid var(--border); }
  button.danger:hover{ background:var(--track); }

  .progress-wrap{ margin-top:16px; display:none; }
  .progress-wrap.show{ display:block; }
  .status-line{
    font-size:13px; color:var(--muted); margin-bottom:8px;
    display:flex; justify-content:space-between;
  }
  .track{
    height:10px; background:var(--track);
    border-radius:6px; overflow:hidden;
  }
  .track > div{
    height:100%; width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .error-msg{ color:var(--danger); font-size:13px; margin-top:10px; display:none; }
  .error-msg.show{ display:block; }

  .section-title{ font-size:16px; font-weight:650; margin-bottom:14px; }
  .empty{ color:var(--muted); font-size:14px; }

  .video-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
  }
  .video-name{ font-size:14px; font-weight:550; word-break:break-word; margin-bottom:4px; }
  .video-meta{ font-size:12px; color:var(--muted); margin-bottom:12px; }
  .video-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .video-actions a{ text-decoration:none; }

  #modal{
    position:fixed; inset:0; z-index:10;
    background:rgba(0,0,0,.8);
    display:none; align-items:center; justify-content:center;
    padding:16px;
  }
  #modal.show{ display:flex; }
  .player-box{
    width:100%; max-width:900px;
    background:#000; border-radius:10px; overflow:hidden;
  }
  .player-box video{ width:100%; display:block; max-height:75vh; background:#000; }
  .modal-close{ display:block; margin:14px auto 0; }

  footer{ color:var(--muted); font-size:12px; text-align:center; padding:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Video Downloader</h1>
  <div class="subtitle">Paste a link, download the video, watch it anywhere.</div>

  <div class="card">
    <div class="row">
      <input id="url" type="text" placeholder="https://... video link" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="downloadBtn">Download</button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="status-line">
        <span id="statusText">queued</span>
        <span id="percentText">0%</span>
      </div>
      <div class="track"><div id="trackFill"></div></div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="card">
    <div class="section-title">Your library</div>
    <div id="videoList"><div class="empty">No videos yet — download one above.</div></div>
  </div>

  <footer>Runs locally &middot; files saved in /downloads</footer>
</div>

<div id="modal">
  <div>
    <div class="player-box">
      <video id="player" controls playsinline></video>
    </div>
    <button class="modal-close ghost" id="closeModal">Close</button>
  </div>
</div>

<script>
const urlInput = document.getElementById('url');
const downloadBtn = document.getElementById('downloadBtn');
const progressWrap = document.getElementById('progressWrap');
const statusText = document.getElementById('statusText');
const percentText = document.getElementById('percentText');
const trackFill = document.getElementById('trackFill');
const errorMsg = document.getElementById('errorMsg');
const videoList = document.getElementById('videoList');
const modal = document.getElementById('modal');
const player = document.getElementById('player');

function setBar(percent){ trackFill.style.width = (percent || 0) + '%'; }

function fmtSize(bytes){
  if(bytes > 1024*1024*1024) return (bytes/1024/1024/1024).toFixed(2) + ' GB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

async function loadVideos(){
  const res = await fetch('/api/videos');
  const videos = await res.json();
  if(!videos.length){
    videoList.innerHTML = '<div class="empty">No videos yet — download one above.</div>';
    return;
  }
  videoList.innerHTML = '';
  videos.forEach(v => {
    const item = document.createElement('div');
    item.className = 'video-item';
    item.innerHTML = `
      <div class="video-name">${v.name}</div>
      <div class="video-meta">${fmtSize(v.size)}</div>
      <div class="video-actions">
        <button class="small watch-btn">Watch</button>
        <a href="/videos/${encodeURIComponent(v.name)}" download="${v.name}"><button class="small ghost">Save</button></a>
        <button class="small danger del-btn">Delete</button>
      </div>
    `;
    item.querySelector('.watch-btn').addEventListener('click', () => {
      player.src = '/videos/' + encodeURIComponent(v.name);
      modal.classList.add('show');
      player.play().catch(()=>{});
    });
    item.querySelector('.del-btn').addEventListener('click', async () => {
      if(!confirm('Delete this video?')) return;
      await fetch('/api/videos/' + encodeURIComponent(v.name), {method:'DELETE'});
      loadVideos();
    });
    videoList.appendChild(item);
  });
}

document.getElementById('closeModal').addEventListener('click', () => {
  modal.classList.remove('show');
  player.pause();
  player.removeAttribute('src');
  player.load();
});
modal.addEventListener('click', (e) => { if(e.target === modal) document.getElementById('closeModal').click(); });

let polling = null;

downloadBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  errorMsg.classList.remove('show');
  if(!url) return;

  downloadBtn.disabled = true;
  progressWrap.classList.add('show');
  statusText.textContent = 'queued';
  percentText.textContent = '0%';
  setBar(0);

  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    if(!res.ok){
      throw new Error(data.error || 'could not start download');
    }
    poll(data.job_id);
  } catch(err){
    showError(err.message);
    downloadBtn.disabled = false;
    progressWrap.classList.remove('show');
  }
});

function showError(msg){
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
}

function poll(jobId){
  if(polling) clearInterval(polling);
  polling = setInterval(async () => {
    const res = await fetch('/api/status/' + jobId);
    const job = await res.json();
    statusText.textContent = job.status;
    percentText.textContent = (job.percent || 0) + '%';
    setBar(job.percent || 0);

    if(job.status === 'finished'){
      clearInterval(polling);
      downloadBtn.disabled = false;
      progressWrap.classList.remove('show');
      urlInput.value = '';
      loadVideos();
    } else if(job.status === 'error'){
      clearInterval(polling);
      downloadBtn.disabled = false;
      progressWrap.classList.remove('show');
      showError(job.error || 'download failed');
    }
  }, 800);
}

urlInput.addEventListener('keydown', e => { if(e.key === 'Enter') downloadBtn.click(); });

loadVideos();
</script>
</body>
</html>
